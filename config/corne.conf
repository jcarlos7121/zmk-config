# Enable nice!view
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_SLEEP=y
# Disable idle blanking
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# Space thumb key chatters, producing double/triple presses.
# Press stays at the 5ms default to avoid adding latency.
# Release is raised to absorb contact bounce and intermittent socket contact.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=20
